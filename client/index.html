<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevBlog - Master Modern Web Development</title>
    <meta name="description" content="Discover cutting-edge web development techniques, best practices, and insights from industry experts. Learn React, TypeScript, database design, and more with our comprehensive tutorials and guides." />
    <meta name="author" content="DevBlog Team" />
    <meta name="keywords" content="web development, react, typescript, javascript, programming, tutorials, blog, coding, frontend, backend, database design" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devblog.dev/" />
    <meta property="og:title" content="DevBlog - Master Modern Web Development" />
    <meta property="og:description" content="Discover cutting-edge web development techniques, best practices, and insights from industry experts." />
    <meta property="og:image" content="https://devblog.dev/hero-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://devblog.dev/" />
    <meta property="twitter:title" content="DevBlog - Master Modern Web Development" />
    <meta property="twitter:description" content="Discover cutting-edge web development techniques, best practices, and insights from industry experts." />
    <meta property="twitter:image" content="https://devblog.dev/hero-image.jpg" />

    <!-- Favicon -->
    <link rel="canonical" href="https://devblog.dev/" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Blog",
      "name": "DevBlog",
      "description": "A modern blog platform for web developers",
      "url": "https://devblog.dev/",
      "author": {
        "@type": "Organization",
        "name": "DevBlog Team"
      },
      "publisher": {
        "@type": "Organization",
        "name": "DevBlog",
        "logo": {
          "@type": "ImageObject",
          "url": "https://devblog.dev/logo.png"
        }
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
